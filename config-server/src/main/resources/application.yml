server:
  port: 8888

logging:
  level:
    ROOT: INFO
    org.spring.framework.cloud.config: DEBUG

spring:
  application:
    name: configserver
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPOSITORY_PATH:file:./config-server-repository}
    fail-fast: true
  security:
    user:
      name: spring_cloud_user
      password: ${CONFIG_SERVER_PASSWORD}

log:
  app-name: config-server
