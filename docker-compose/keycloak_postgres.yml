volumes:
  postgres_data:
    driver: local

services:
  postgres:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - "POSTGRES_DB=${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}"
      - "POSTGRES_USER=${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}"
      - "POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"
  keycloak-authorization-server:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-latest}
    hostname: keycloak-server
    ports:
      - "8081:8081"
    environment:
      - "KEYCLOAK_USER=${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}"
      - "KEYCLOAK_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}"
      - "KEYCLOAK_LOGLEVEL=DEBUG"
      - "JAVA_OPTS=-Djboss.http.port=8081"
      - "DB_VENDOR=POSTGRES"
      - "DB_ADDR=postgres"
      - "DB_DATABASE=${KEYCLOAK_DB_NAME:?KEYCLOAK_DB_NAME is required}"
      - "DB_USER=${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER is required}"
      - "DB_SCHEMA=public"
      - "DB_PASSWORD=${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}"
    depends_on:
      - postgres
